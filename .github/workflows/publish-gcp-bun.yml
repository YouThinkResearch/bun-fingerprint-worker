name: Build & Push Bun image (BuildJet, amd64)

on:
  push:
    branches: [main]

env:
  GCP_PROJECT_ID: absolute-nuance-268810   # GCP project to push image to
  GCP_LOCATION: europe                     # Artifact Registry location (e.g., europe, us, asia)
  REPO_NAME: yt/bun-fingerprint               # Artifact Registry repository name
  IMAGE_TAG: ${{ github.run_number }}      # Sequential run number used as image tag

jobs:
  build:
    runs-on: buildjet-4vcpu-ubuntu-2204    # BuildJet's default amd64 runner
    permissions:
      contents: read
      id-token: write                      # Required for gcp-auth OIDC or SA-key

    steps:
      # ───── source ─────
      - uses: actions/checkout@v4          # Checkout source code

      # ───── docker buildx ─────
      - uses: docker/setup-buildx-action@v3

      # ───── Google Cloud auth ─────
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GCP_LOCATION-docker.pkg.dev --quiet

      # ───── build & push ─────
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile                 # Path to the Bun Dockerfile we created
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GCP_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.GCP_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}:cache
          cache-to:   type=registry,ref=${{ env.GCP_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}:cache,mode=max 